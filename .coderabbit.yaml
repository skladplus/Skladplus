language: ru-RU

tone_instructions: >-
  Отвечай по-русски, коротко и по делу, без похвал и вводных фраз.
  Указывай конкретную строку и конкретное последствие, а не общее наблюдение.

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
  path_instructions:
    - path: "**/*.{ts,tsx}"
      instructions: >-
        Деньги — только целые копейки в bigint; Float и Decimal в денежных полях
        считать ошибкой. Даты — timestamptz, вывод только через
        Intl.DateTimeFormat('uk-UA', {timeZone:'Europe/Kyiv'}); рантайм UTC.
        Любой доступ к данным клиента обязан идти через обёртку packages/db
        с обязательным accountId — прямой вызов Prisma из apps/ это дыра
        в разграничении доступа между клиентами, отмечать её всегда.
        packages/core не знает о фреймворке и базе: ни React, ни Next,
        ни Prisma, ни packages/db.
    - path: ".github/workflows/**"
      instructions: >-
        Экшены обязаны быть пинованы 40-символьным SHA. Значения ${{ }} нельзя
        подставлять прямо в run — только через env. paths и paths-ignore
        запрещены: отфильтрованный обязательный чек навсегда остаётся pending.
    - path: "**/*.prisma"
      instructions: >-
        Деньги — BigInt, время — timestamptz. У каждой таблицы с данными клиента
        обязан быть accountId и индекс по нему.
    - path: "{docs/**/*.md,AGENTS.md,README.md}"
      instructions: >-
        Документ описывает состояние, а не историю: настоящее время, без
        «выяснилось», «оказалось», «пришлось», «был заведён». Как пришли
        к решению — в git log и PROGRESS/; в документе этого быть не должно.
        Обоснование оставлять только там, где без него правило нарушат: если
        удаление «почему» не меняет ничьё поведение — это балласт, отмечать.
        Перечисление однородного (поля формы, колонки таблицы, пункты меню)
        обязано быть таблицей или списком: абзац с разделителями «·» внутри —
        это список, потерявший строки, на его пункт нельзя сослаться и его
        правка переформатирует блок целиком. Исключение — определение формата
        записи в одну строку.
    - path: "docs/02-architecture.md"
      instructions: >-
        Решение записывается строкой таблицы: что · почему · статус · дата.
        Новый раздел прозой — ошибка. Отменённое решение получает статус, но
        не удаляется. Правило места в AGENTS.md, открытый вопрос —
        в docs/findings-backlog.md; дублирование их в журнал отмечать.

chat:
  auto_reply: true
