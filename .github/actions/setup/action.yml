name: Установка окружения
description: >-
  Node, pnpm и зависимости. Порядок шагов обязателен: pnpm ставится до setup-node,
  иначе cache=pnpm не находит store. Версия pnpm не указывается — она берётся
  из поля packageManager, указание в двух местах даёт конфликт.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    # --ignore-scripts: postinstall зависимости выполняться на раннере с токенами
    # не должен. Нужные сборки вызываются явными шагами.
    - shell: bash
      run: pnpm install --frozen-lockfile --ignore-scripts

    # Клиент Prisma генерируется, а не коммитится, поэтому нужен КАЖДОМУ джобу,
    # а не только сборке: без него не проходят ни типы, ни тесты. Генерация
    # не ходит в базу и стоит миллисекунды.
    - shell: bash
      run: pnpm -r --if-present db:generate
